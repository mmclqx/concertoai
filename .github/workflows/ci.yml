# CI：push/PR 自动全量验证（三平台矩阵，v3.2 M1 / T1.1）；真实 API 冒烟手动触发（key 走 repository secrets）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run verify

  # 真实 API 端到端冒烟：手动触发（workflow_dispatch），
  # DEEPSEEK_API_KEY 在仓库 Settings → Secrets and variables → Actions 中配置。
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 端到端冒烟（run 只读任务）
        run: node dist/cli/index.js run "列出当前目录的文件结构"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
